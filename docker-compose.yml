x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://orders:orders@postgres:5432/orders
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-32chars}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-whsec_local_dev_secret}
  SMTP_URL: smtp://mailpit:1025

services:
  api:
    build: .
    # Running migrations on boot is fine with one replica. With more, move this to a
    # separate release step so instances don't race each other.
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    environment: *app-env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s

  worker:
    build: .
    command: node dist/worker.js
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
